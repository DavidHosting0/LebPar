# LebPar — Nginx config
# Canonical host: https://lebpar.com  (NO www)
# www and http both 301 → https://lebpar.com$request_uri

proxy_cache_path /var/cache/nginx/lebpar levels=1:2 keys_zone=lebpar_cache:10m
                 max_size=256m inactive=60m use_temp_path=off;

upstream lebpar_upstream {
    server 127.0.0.1:3030;
    keepalive 16;
}

# HTTP → HTTPS (preserve host briefly; next blocks force apex)
server {
    listen 80;
    listen [::]:80;
    server_name lebpar.com www.lebpar.com;
    return 301 https://lebpar.com$request_uri;
}

# www → non-www (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.lebpar.com;

    # certbot — keep your real paths
    # ssl_certificate     /etc/letsencrypt/live/lebpar.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/lebpar.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://lebpar.com$request_uri;
}

# Canonical site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lebpar.com;

    # ssl_certificate     /etc/letsencrypt/live/lebpar.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/lebpar.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /_next/static/ {
        proxy_pass http://lebpar_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /media/ {
        proxy_pass http://lebpar_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        proxy_pass http://lebpar_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache lebpar_cache;
        proxy_cache_valid 200 301 302 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_key "$scheme$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
